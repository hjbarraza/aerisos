general {
    lock_cmd = pidof hyprlock || hyprlock                             # one lock screen at a time
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

listener {   # 2.5 min: dim the screen
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {   # 5 min: lock
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {   # 5.5 min: screen off
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {   # 30 min: suspend
    timeout = 1800
    on-timeout = systemctl suspend
}
