# AERIS MangoHud: a small black-and-white overlay, top left. Per game in Steam:
# Properties -> Launch options:  mangohud gamemoderun %command%
# Right Shift+F12 shows/hides it, Right Shift+F11 starts/stops a frametime log (~/Games/mangohud-logs).
legacy_layout=false
position=top-left
round_corners=0
background_alpha=0.75
background_color=0A0A0A
text_color=E6E6E6
gpu_color=E6E6E6
cpu_color=E6E6E6
vram_color=E6E6E6
ram_color=E6E6E6
engine_color=E6E6E6
frametime_color=FFFFFF
font_size=18
table_columns=3

fps
frametime
frame_timing
gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram
gamemode

toggle_hud=Shift_R+F12
toggle_logging=Shift_R+F11
output_folder=/home/h/Games/mangohud-logs
