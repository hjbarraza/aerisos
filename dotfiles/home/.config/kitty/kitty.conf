# Clipboard: selecting text copies it automatically
copy_on_select clipboard

# Ctrl+C copies when text is selected, otherwise sends interrupt (stops the program)
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v kitten smart_paste.py
# Ctrl+Shift+C / Ctrl+Shift+V keep working too (kitty defaults)


# Font
font_family      Söhne Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9

# Right-click pastes the clipboard (also inside apps that capture the mouse)
mouse_map right press ungrabbed,grabbed paste_from_clipboard

# Breathing room between the text and the window border (pt: vertical horizontal)
window_padding_width 10 14
