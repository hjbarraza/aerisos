# AERIS monochrome theme for kitty, 1:1 with the AerisOS Ghostty theme
# (black background, paper text, white emphasis; all ANSI colours are greys).
term xterm-256color

font_family Söhne Mono
font_size   10

window_padding_width 4 8
cursor_shape beam
copy_on_select clipboard
confirm_os_window_close 0
scrollback_lines 20000
enable_audio_bell no

background           #000000
foreground           #e6e6e6
cursor               #ffffff
cursor_text_color    #000000
selection_background #e6e6e6
selection_foreground #000000

color0  #0a0a0a
color1  #8c8c8c
color2  #e6e6e6
color3  #b0b0b0
color4  #b0b0b0
color5  #9a9a9a
color6  #e6e6e6
color7  #e6e6e6
color8  #262626
color9  #ffffff
color10 #ffffff
color11 #e6e6e6
color12 #ffffff
color13 #e6e6e6
color14 #f0f0f0
color15 #ffffff

# Right-click and Ctrl+V paste (selecting text already copies, see copy_on_select). Both go
# through smart_paste.py: text is pasted; an image-only clipboard (a fresh screenshot) becomes
# a ctrl+v key for the app, so Claude Code attaches the image; vim keeps its own Ctrl+V.
mouse_map right press ungrabbed kitten smart_paste.py mouse
map ctrl+v kitten smart_paste.py key

# rzr: Ctrl+C copies when text is selected, otherwise sends interrupt
map ctrl+c copy_and_clear_or_interrupt
