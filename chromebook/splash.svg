<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768">
  <!-- tinyraven boot splash (the Plymouth background and the source of the firmware logo).
       The bird is the hero. Everything sits on an 8 px grid:
       bird 192-368, wordmark 456, "ONTOLOGY TERMINAL" 480, phrase 504, hairline 536, foot 568.
       The phrase line is empty here: Plymouth draws a random line from phrases.txt on it,
       so the firmware logo shows the lockup and Linux adds the punchline.
       The bird is centred by eye: midway between its box centre and its centre of mass.
       小鴉 (kogarasu) = little raven. Plymouth sweeps a light along the hairline.
       Fonts: Söhne, Söhne Mono, a Japanese sans. -->
  <rect width="1366" height="768" fill="#000"/>

  <!-- Raven: smooth standing silhouette with two feet, drawn in a 200x200 box, at 1.2 -->
  <g transform="translate(562.3,139.2) scale(1.2)">
    <!-- Legs and feet (drawn first, under the body) -->
    <path d="M96,158 V189 M92,189 H105 M114,152 V189 M110,189 H123" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path fill="#fff" d="M186,74 C172,62 160,52 146,48 C128,40 110,46 102,62 C88,84 66,112 48,142 C36,160 22,178 10,192 C30,186 46,178 60,170 C80,170 100,168 116,158 C136,146 148,124 150,100 C151,90 156,82 162,80 C170,78 178,76 186,74 Z"/>
    <circle cx="138" cy="62" r="4" fill="#000"/>
  </g>

  <!-- Wordmark: tiny regular, raven bold (as ÆRIS OS is set) -->
  <text x="683" y="456" font-family="Söhne, Sohne" font-size="44" letter-spacing="-1.5" fill="#fff" text-anchor="middle"><tspan font-weight="400">tiny</tspan><tspan font-weight="700">raven</tspan></text>

  <!-- What it is. The phrase line (baseline 504) follows it at boot. -->
  <text x="685" y="480" font-family="Söhne Mono, Sohne Mono" font-size="11" letter-spacing="4" fill="#7a7a7a" text-anchor="middle">ONTOLOGY TERMINAL</text>

  <!-- Hairline (Plymouth's loading light runs along it) -->
  <rect x="603" y="536" width="160" height="1" fill="#262626"/>

  <!-- Foot: the system it belongs to, and the Japanese name -->
  <text x="683" y="569" text-anchor="middle"><tspan font-family="Söhne, Sohne" font-size="15" font-weight="400" fill="#e6e6e6">ÆRIS</tspan><tspan font-family="Söhne, Sohne" font-size="15" font-weight="700" dx="3" fill="#e6e6e6">OS</tspan><tspan font-family="Source Han Sans JP, Noto Sans CJK JP, Hiragino Sans" font-size="12" letter-spacing="4" dx="12" fill="#7a7a7a">小鴉</tspan></text>
</svg>
