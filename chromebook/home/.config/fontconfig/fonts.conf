<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default fonts: Die Grotesk for all interface and sans-serif text, Söhne Mono
     for monospace (Die Grotesk has no mono cut). "strong" puts them ahead of the
     distribution's own defaults. -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Die Grotesk VF</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Die Grotesk VF</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Sohne Mono</family></prefer></alias>
</fontconfig>
