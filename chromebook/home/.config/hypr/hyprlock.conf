# tinyraven lock screen: the boot splash, standing still.
# Pure black, centred, on the splash's own grid: the raven, the wordmark, the time where
# the boot phrase sits, the password field where the hairline is, ÆRIS OS at the foot.
# raven.png is made by setup.sh (the upright frame of the boot animation).
# Positions are offsets from the screen centre, y upwards. Monochrome only.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(000000ff)
}

image {   # the raven, 280x224, as on the splash
    monitor =
    path = ~/.config/hypr/raven.png
    size = 224
    rounding = 0
    border_size = 0
    position = 0, 104
    halign = center
    valign = center
}

label {   # wordmark: tiny regular, raven bold
    monitor =
    text = <span weight="normal">tiny</span><span weight="bold">raven</span>
    font_family = Sohne
    font_size = 33
    color = rgba(ffffffff)
    position = 0, -58
    halign = center
    valign = center
}

label {   # time · date
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='4096'>$(date +'%H:%M  ·  %A %d %b' | tr '[:lower:]' '[:upper:]')</span>"
    font_family = Sohne Mono
    font_size = 9
    color = rgba(7a7a7aff)
    position = 0, -92
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(3a3a3aff)
    inner_color = rgba(000000ff)
    font_color = rgba(ffffffff)
    font_family = Sohne Mono
    check_color = rgba(ffffffff)
    fail_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##5a5a5a" letter_spacing="2048">PASSWORD</span>
    fail_text = <span foreground="##ffffff" letter_spacing="2048">ACCESS DENIED</span>
    dots_size = 0.18
    dots_spacing = 0.5
    dots_center = true
    position = 0, -150
    halign = center
    valign = center
}

label {   # foot: the system it belongs to, and the Japanese name
    monitor =
    text = <span weight="normal">ÆRIS</span> <span weight="bold">OS</span>
    font_family = Sohne
    font_size = 11
    color = rgba(e6e6e6ff)
    position = -22, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = 小鴉
    font_family = Noto Sans CJK JP
    font_size = 9
    color = rgba(7a7a7aff)
    position = 34, -200
    halign = center
    valign = center
}
