# Internal microphone fix for this Chromebook (Samsung Chromebook 4, sof-glkda7219max).
# The mic device has 4 channels, but only the first two carry the microphone; the
# other two hold a constant value. Mixed to mono, that gave a large DC offset and
# half the level. This virtual source passes on the two live channels only.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Internal Microphone (live channels)"
      capture.props = {
        node.name         = "capture.internal_mic_live"
        target.object     = "alsa_input.pci-0000_00_0e.0-platform-glk_da7219_def.HiFi__Mic__source"
        audio.position    = [ FL FR ]
        stream.dont-remix = true
        node.passive      = true
      }
      playback.props = {
        node.name      = "internal_mic_live"
        media.class    = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
