[General]
# Fonts must be installed system-wide (/usr/local/share/fonts): the greeter runs as the sddm user
Font="Söhne"
MonoFont="Söhne Mono"
JapaneseFont="Source Han Sans JP"
# Icons (Nerd Font glyphs, Material Design and Codicons), installed system-wide in /usr/share/fonts/TTF
IconFont="NotoSansM Nerd Font Mono"
# Live info file written by aeris-status.timer (needs QML_XHR_ALLOW_FILE_READ=1 in GreeterEnvironment)
StatusFile="/var/lib/aeris/status.json"
